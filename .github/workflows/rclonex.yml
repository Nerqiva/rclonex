---
# rclonex CI: tests, regression, cross-platform builds, releases.
# Kept separate from the upstream "build" workflow so upstream rebases stay mechanical.

name: rclonex

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RCLONE_CONFIG: /notfound

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build rclonex
        run: go build -o rclonex .
      - name: gofmt check
        run: test -z "$(gofmt -l cmd fs lib vfs librclone)" || { gofmt -l cmd fs lib vfs librclone; exit 1; }
      - name: Version reports rclonex Calver
        run: ./rclonex version
      - name: Unit tests (archive, fs, lib)
        run: go test -timeout 20m ./cmd/archive/... ./fs/... ./lib/...
      - name: Regression tests (short, all packages)
        run: go test -short -timeout 20m ./...

  large-file:
    name: large-file (resource)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Large archive extraction with RSS budget
        run: RCLONE_CONFIG=/notfound go test -timeout 15m -run 'Large' -v -count=1 ./cmd/archive/extract/

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: '386' }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build rclonex
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p stage
          if [ "$GOOS" = windows ]; then
            go build -trimpath -o stage/rclonex.exe -ldflags "-s -X github.com/rclone/rclone/fs.Version=$(cat VERSION)" .
          else
            go build -trimpath -o stage/rclonex -ldflags "-s -X github.com/rclone/rclone/fs.Version=$(cat VERSION)" .
          fi
      - name: Package
        run: |
          cd stage
          if [ "${{ matrix.goos }}" = windows ]; then
            apt-get update -qq && apt-get install -y -qq zip >/dev/null
            zip "rclonex_$(cat VERSION)_${{ matrix.goos }}_${{ matrix.goarch }}.zip" rclonex.exe
          else
            tar -czf "rclonex_$(cat VERSION)_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" rclonex
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rclonex-${{ matrix.goos }}-${{ matrix.goarch }}
          path: stage/rclonex_*

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rclonex-*
          merge-multiple: true
      - name: Checksums
        id: sums
        run: |
          sha256sum rclonex_* > checksums.txt
          cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease --title "$GITHUB_REF_NAME" rclonex_* checksums.txt
