---
# rclonex CI: tests, regression, cross-platform builds, releases.
# Kept separate from the upstream "build" workflow so upstream rebases stay mechanical.

name: "RcloneX: Test, Build & Release"

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RCLONE_CONFIG: /notfound

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install FUSE and NFS helpers (for mount tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3 nfs-common
      - name: Build rclonex
        run: go build -o rclonex .
      - name: gofmt check
        run: test -z "$(gofmt -l cmd fs lib vfs librclone)" || { gofmt -l cmd fs lib vfs librclone; exit 1; }
      - name: Shell syntax check
        run: bash -n bin/install-rclonex.sh
      - name: Version reports rclonex Calver
        run: ./rclonex version
      - name: Unit tests (archive, fs, lib)
        run: go test -timeout 20m ./cmd/archive/... ./fs/... ./lib/...
      - name: Unit tests with unarr fallback
        run: go test -tags unarr -timeout 20m ./cmd/archive/extract/
      - name: Regression tests (short, all packages)
        run: go test -short -timeout 20m ./...

  large-file:
    name: large-file (resource)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Large archive extraction with RSS budget
        run: RCLONE_CONFIG=/notfound go test -timeout 15m -run 'Large' -v -count=1 ./cmd/archive/extract/

  build:
    name: build (${{ matrix.asset || matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, cgo: '1', gotags: unarr }
          - { goos: linux, goarch: '386' }
          - { goos: linux, goarch: arm64, cgo: '1', gotags: unarr, cc: aarch64-linux-gnu-gcc }
          - { goos: linux, goarch: arm64, asset: termux }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install ARM64 cross compiler
        if: matrix.cc != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build rclonex
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOTAGS: ${{ matrix.gotags || '' }}
          CC: ${{ matrix.cc || '' }}
        run: |
          mkdir -p stage
          if [ "$GOOS" = windows ]; then
            go build -trimpath ${GOTAGS:+-tags "$GOTAGS"} -o stage/rclonex.exe -ldflags "-s -X github.com/rclone/rclone/fs.Version=$(cat VERSION)" .
          else
            go build -trimpath ${GOTAGS:+-tags "$GOTAGS"} -o stage/rclonex -ldflags "-s -X github.com/rclone/rclone/fs.Version=$(cat VERSION)" .
          fi
      - name: Package
        run: |
          # Unversioned asset names so releases/latest/download/<name> works for scripts
          cd stage
          if [ "${{ matrix.goos }}" = windows ]; then
            apt-get update -qq && apt-get install -y -qq zip >/dev/null
            zip "rclonex_${{ matrix.goos }}_${{ matrix.goarch }}.zip" rclonex.exe
          else
            tar -czf "rclonex_${{ matrix.asset || matrix.goos }}_${{ matrix.goarch }}.tar.gz" rclonex
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: rclonex-${{ matrix.asset || matrix.goos }}-${{ matrix.goarch }}
          path: stage/rclonex_*

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rclonex-*
          merge-multiple: true
      - name: Checksums
        id: sums
        run: |
          sha256sum rclonex_* > checksums.txt
          cat checksums.txt
      - name: Prepare install script
        run: |
          cp bin/install-rclonex.sh install.sh
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag pushes release the tag name; pushes to main and manual runs
          # release the version in the VERSION file.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(cat VERSION)"
          fi
          # Pre-release only for suffixed versions (e.g. -alpha.1) so plain
          # CalVer versions become full releases and releases/latest resolves.
          prerelease=
          if [[ "$TAG" == *-* ]]; then prerelease=--prerelease; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              # Idempotent re-runs (e.g. after a tag move): drop the old
              # assets so only correctly named ones remain, then upload.
              for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
                gh release delete-asset "$TAG" --repo "$GITHUB_REPOSITORY" "$a" --yes
              done
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" rclonex_* checksums.txt install.sh
            elif [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" == "true" ]]; then
              # Rolling prerelease: recreate it on the pushed commit so the
              # tag always points at the build it was cut from. Full releases
              # (plain CalVer, cut from a release branch) are left untouched.
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $prerelease --title "$TAG" --notes "Automated prerelease from ${GITHUB_REF_NAME} @ $(git rev-parse --short HEAD)" rclonex_* checksums.txt install.sh
            else
              echo "$TAG is a full release - leaving it untouched"
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes $prerelease --title "$TAG" --target "$GITHUB_SHA" rclonex_* checksums.txt install.sh
          fi
          # Publishing a prerelease from main also copies main into the
          # prerelease version branch (e.g. release/v2026.11.0-alpha.5).
          if [[ "$GITHUB_REF" == refs/heads/main && -n "$prerelease" ]]; then
            git push --force origin "$GITHUB_SHA:refs/heads/release/$TAG"
          fi
