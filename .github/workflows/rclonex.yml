---

name: "RcloneX: Test, Build & Release"

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RCLONE_CONFIG: /notfound

jobs:
  version:
    name: version
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      skip_run: ${{ steps.bump.outputs.skip_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute daily CalVer and bump version
        id: bump
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%s)"
          if echo "$MSG" | grep -qE '^chore\(release\):'; then
            echo "skip_run=true" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Skipping: latest commit is an automated release bump ($MSG)"
            exit 0
          fi
          echo "skip_run=false" >> "$GITHUB_OUTPUT"
          DATE="$(date -u +%Y.%m.%d)"
          COUNT="$(git tag -l "v${DATE}.*" | wc -l | tr -d ' ')"
          NEXT=$((COUNT + 1))
          VERSION="v${DATE}.${NEXT}-alpha"
          echo "Computed version: $VERSION"
          echo "$VERSION" > VERSION
          printf 'package fs\n\n// VersionTag of rclonex (fork of rclone)\nvar VersionTag = "%s"\n' "$VERSION" > fs/versiontag.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION fs/versiontag.go
          if git diff --cached --quiet; then
            echo "Version files already at $VERSION"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): ${VERSION#v} [skip ci]"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  sidecars:
    uses: ./.github/workflows/lib7zip-sidecars.yml
    permissions:
      contents: write

  test:
    name: test
    needs: version
    if: needs.version.outputs.skip_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install FUSE and NFS helpers (for mount tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3 nfs-common
      - name: Build rclonex
        run: go build -o rclonex .
      - name: gofmt check
        run: test -z "$(gofmt -l cmd fs lib vfs librclone)" || { gofmt -l cmd fs lib vfs librclone; exit 1; }
      - name: Shell syntax check
        run: bash -n bin/install-rclonex.sh
      - name: Version reports rclonex Calver
        run: ./rclonex version
      - name: Unit tests (archive, fs, lib)
        run: go test -timeout 20m ./cmd/archive/... ./fs/... ./lib/...
      - name: Regression tests (short, all packages)
        run: go test -short -timeout 20m ./...

  lib7zip:
    name: test (lib7zip engine)
    needs: [version, sidecars]
    if: needs.version.outputs.skip_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Download cached lib7zip sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . third_party/sevenzip-go/PREBUILT
          gh release download "lib7zip-sidecars-$PREBUILT_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'lib7zip-linux-amd64.tar.gz' \
            --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/lib7zip"
          tar -xzf "$RUNNER_TEMP/lib7zip-linux-amd64.tar.gz" -C "$RUNNER_TEMP/lib7zip"
      - name: Compile extract tests beside the sidecars
        run: |
          go test -c -o "$RUNNER_TEMP/lib7zip/extract.test" ./cmd/archive/extract
          ln -s "$GITHUB_WORKSPACE/cmd/archive/extract/testdata" "$RUNNER_TEMP/lib7zip/testdata"
      - name: Exercise the lib7zip engine
        env:
          RCLONE_7ZIP_LIB: ${{ runner.temp }}/lib7zip/libc7zip.so
          RCLONE_CONFIG: /notfound
        run: |
          cd "$RUNNER_TEMP/lib7zip"
          ./extract.test -test.v -test.run 'TestLib7zipParity|TestArchiveExtractPassword|TestExtractSevenZipMultiVolume|TestArchiveExtractLargeSevenZipMultiVolume'

  large-file:
    name: large-file (resource)
    needs: version
    if: needs.version.outputs.skip_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Large archive extraction with RSS budget
        run: RCLONE_CONFIG=/notfound go test -timeout 15m -run 'Large' -v -count=1 ./cmd/archive/extract/

  build:
    name: build (${{ matrix.asset || matrix.goos }}/${{ matrix.goarch }})
    needs: [version, sidecars]
    if: needs.version.outputs.skip_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, cgo: '1', lib7zip: true }
          - { goos: linux, goarch: '386' }
          - { goos: linux, goarch: arm64, cgo: '1', cc: aarch64-linux-gnu-gcc, lib7zip: true }
          - { goos: linux, goarch: arm64, asset: termux }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install ARM64 cross compiler
        if: matrix.cc != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build rclonex
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          CC: ${{ matrix.cc || '' }}
        run: |
          mkdir -p stage
          if [ "$GOOS" = windows ]; then
            go build -trimpath -o stage/rclonex.exe -ldflags "-s -X github.com/rclone/rclone/fs.Version=$(cat VERSION)" .
          else
            go build -trimpath -o stage/rclonex -ldflags "-s -X github.com/rclone/rclone/fs.Version=$(cat VERSION)" .
          fi
      - name: Fetch lib7zip sidecars
        if: matrix.lib7zip
        env:
          GH_TOKEN: ${{ github.token }}
          SIDECAR: lib7zip-${{ matrix.asset || matrix.goos }}-${{ matrix.goarch }}.tar.gz
        run: |
          . third_party/sevenzip-go/PREBUILT
          gh release download "lib7zip-sidecars-$PREBUILT_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SIDECAR" \
            --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/$SIDECAR" -C stage
      - name: Package
        run: |
          cd stage
          if [ "${{ matrix.goos }}" = windows ]; then
            apt-get update -qq && apt-get install -y -qq zip >/dev/null
            zip "rclonex_${{ matrix.goos }}_${{ matrix.goarch }}.zip" rclonex.exe
          elif [ "${{ matrix.lib7zip }}" = "true" ]; then
            codecs=""
            if [ -d Codecs ]; then codecs=Codecs; fi
            tar -czf "rclonex_${{ matrix.asset || matrix.goos }}_${{ matrix.goarch }}.tar.gz" rclonex libc7zip.so 7z.so NOTICE.md licenses $codecs
          else
            tar -czf "rclonex_${{ matrix.asset || matrix.goos }}_${{ matrix.goarch }}.tar.gz" rclonex
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: rclonex-${{ matrix.asset || matrix.goos }}-${{ matrix.goarch }}
          path: stage/rclonex_*

  release:
    name: release
    if: needs.version.outputs.skip_run != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [version, test, lib7zip, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: rclonex-*
          merge-multiple: true
      - name: Checksums
        id: sums
        run: |
          sha256sum rclonex_* > checksums.txt
          cat checksums.txt
      - name: Prepare install script
        run: |
          cp bin/install-rclonex.sh install.sh
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA="${{ needs.version.outputs.sha || github.sha }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(cat VERSION)"
          fi
          prerelease=
          if [[ "$TAG" == *-* ]]; then prerelease=--prerelease; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
                gh release delete-asset "$TAG" --repo "$GITHUB_REPOSITORY" "$a" --yes
              done
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" rclonex_* checksums.txt install.sh
            elif [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" == "true" ]]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" $prerelease --title "$TAG" --notes "Automated prerelease from ${GITHUB_REF_NAME} @ $(git rev-parse --short HEAD)" rclonex_* checksums.txt install.sh
            else
              echo "$TAG is a full release - leaving it untouched"
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes $prerelease --title "$TAG" --target "$TARGET_SHA" rclonex_* checksums.txt install.sh
          fi
          if [[ "$GITHUB_REF" == refs/heads/main && -n "$prerelease" ]]; then
            git push --force origin "$TARGET_SHA:refs/heads/release/$TAG"
          fi
